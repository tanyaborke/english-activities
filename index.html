const words=["a student", "a whiteboard", "a blackboard", "a desk", "a chair", "a cupboard", "a bookcase", "a poster", "a pencil case", "a pen", "a pencil", "a ruler", "a rubber", "a bag", "a sandwich", "a computer", "a teddy bear", "a bag", "glasses", "a ball", "a window", "a lamp", "a bed", "a book", "a bike", "an apple"];let deck=[],index=0;
function shuffle(){deck=[...words];for(let i=deck.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}index=0;render();}
